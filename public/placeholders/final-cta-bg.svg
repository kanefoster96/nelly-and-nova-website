  <text x="50%" y="50%" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#f5f2ea" fill-opacity="0.9">BOOK NOW</text>
  <text x="50%" y="calc(50% + 32px)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#8a8a8a">PLACEHOLDER BACKGROUND</text>
